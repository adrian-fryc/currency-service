name: Java CI/CD with Maven and Docker

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      # -------------------------------------------------------------
      # TUTAJ ZACZYNA SIĘ NASZE NOWE "CD" (BUDOWANIE I WYSYŁKA DOCKERA)
      # -------------------------------------------------------------

      # Krok 4: Robot loguje się do Docker Huba przy użyciu ukrytych sekretów
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Krok 5: Robot buduje obraz z Twojego Dockerfile i wysyła go w kosmos!
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # PONIŻEJ WPISZ SWÓJ LOGIN Z DOCKER HUB (ZAMIAST TWÓJ_LOGIN_DOCKER_HUB)
          tags: adrianfryc/currency-service:latest