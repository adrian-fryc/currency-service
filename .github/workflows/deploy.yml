name: CI/CD Deploy to AWS

on:
  push:
    branches: [ "main", "master" ] # Rurociąg odpali się przy każdym pushu do main lub master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests # Budujemy JARa, pomijając testy

      - name: Copy Files to AWS EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # 👇 POPRAWKA 1: Dopisałem "docker-compose.yml" na końcu, żeby GitHub Actions wysłał ten plik na AWS
          source: "target/*.jar,Dockerfile,docker-compose.yml"
          target: "~/app"
          strip_components: 0

      - name: Execute Remote SSH Commands to Run Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # 👇 POPRAWKA 2: Wywalamy stare komendy "docker run" i zastępujemy je potężnym "docker compose"
          script: |
            cd ~/app
            
            # 1. Gasimy starą strukturę
            docker-compose down || true
            
            # 2. Odpalamy wszystko na czysto
            docker-compose up -d --build