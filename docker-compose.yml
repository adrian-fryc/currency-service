version: '3.8'

services:
  currency-service:
    container_name: currency-service
    build:
      context: .
    expose:
      - "8084"
    depends_on:
      - kafka
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/analyzer_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 👇 Limity pamięci dla Springa (żeby nie zabił serwera)
      JAVA_TOOL_OPTIONS: "-Xmx256M -Xms256M"
      # 👇 Zmienne dla Nginx Proxy
      VIRTUAL_HOST: currency-analyzer.duckdns.org
      VIRTUAL_PORT: 8084
      LETSENCRYPT_HOST: currency-analyzer.duckdns.org
      LETSENCRYPT_EMAIL: twoj-email@gmail.com # 👈 Wpisz swój e-mail

  kafka:
    container_name: kafka-local
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_CLUSTER_ID: 4L62YDkVgSBlwGWw4Emsiw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xmx192M -Xms192M
      KAFKA_LOG_CLEANER_ENABLE: "false"

  postgres-db:
    container_name: postgres-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analyzer_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_pass
    volumes:
      - pgdata:/var/lib/postgresql/data:rw

  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443" # 👈 Poprawione na standardowy port HTTPS
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    restart: always

  nginx-proxy-acme:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-proxy-acme
    depends_on:
      - nginx-proxy
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - vhost:/etc/nginx/vhost.d:rw
      - html:/usr/share/nginx/html:rw
    restart: always

volumes:
  pgdata: {}
  certs: {}
  vhost: {}
  html: {}