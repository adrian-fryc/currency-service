version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: analyzer_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Baza bezpieczna, zamknięta wewnątrz sieci Dockera

  currency-service:
    build: .
    container_name: currency-service
    ports:
      - "80:8084" # 👈 POPRAWKA: Ruch z portu 80 kierujemy na port 8084 Springa
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/analyzer_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # 👇 POPRAWKA: Mówimy Springowi, że Kafka to nazwa kontenera "kafka" w Dockerze
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - postgres-db
      - kafka # 👈 POPRAWKA: Aplikacja czeka na bazę oraz na Kafkę, zanim odpali Olę i Borysa

  kafka:
    image: apache/kafka:latest
    container_name: kafka-local
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 👇 POPRAWKA: Zamiast localhost dajemy kafka, żeby kontenery potrafiły się dogadać
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx192M -Xms192M"
      KAFKA_LOG_CLEANER_ENABLE: "false" # 👈 !!! DODAJ TĘ LINIJKĘ

volumes:
  pgdata: