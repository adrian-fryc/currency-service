server.port=8084

# ==========================================
# 1. DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/analyzer_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 3. KAFKA CONFIGURATION
# ==========================================
# Główne namiary na brokera (Lokalnie: Twój KRaft w Dockerze, AWS: Upstash)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Protokół bezpieczeństwa (Lokalnie: brak zabezpieczeń, AWS: szyfrowany SSL)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

# Mechanizmy uwierzytelniania SASL (Lokalnie: wyłączone/puste, AWS: SCRAM-SHA-256)
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}

# PRODUCER (Wysyłanie zdarzeń jako JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# CONSUMER (Odbieranie zdarzeń jako JSON)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# ZAUFANE PAKIETY (Wymagane do bezpiecznej deserializacji obiektów przez Jacksona)
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.analyzer.model